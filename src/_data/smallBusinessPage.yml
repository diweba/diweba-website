# repeated here.
#
# SEARCH INTENT (distinct from both the homepage AND servicePage.yml):
# "webdesign kleine unternehmen" is an audience-qualification query --
# someone self-selecting by business size/budget before evaluating vendors,
# not yet committed to "get a full website built" as a category the way
# servicePage.yml's visitor is. This page argues the SMB-fit case
# specifically (right-sized scope, plain language, one point of contact,
# mobile-first, maintainable) rather than explaining the general service
# model servicePage.yml already covers.
#
# DUPLICATE-CONTENT GUARDS:
#   - The "who this is NOT for" section reads pricingPage[lang].oneThingBody
#     directly in the template (landing-body.njk), the same reused sentence
#     as servicePage.yml -- not re-typed here.
