  <!--
    Sveltia CMS.

    Git-based: edits are committed to the repository, which triggers the GitHub
    Actions build and deploy. The public site stays statically generated — the
    CMS never renders anything to visitors (spec §5, §7).

    PHASE 2 completes this. The collections in config.yml currently cover only
    what Phase 1 actually has. Adding a collection before its content model and
    templates exist would create fields that write front matter nothing reads.

    AUTHENTICATION: Sveltia authenticates via GitHub. It needs a GitHub OAuth
    app (or the Sveltia-hosted auth flow) configured against this repository
    before login will work — see docs/DIWEBA_PHASE_0_SPEC.md §5.
  -->
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
