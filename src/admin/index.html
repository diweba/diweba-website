    Sveltia CMS.

    Git-based: edits are committed to the repository, which triggers the GitHub
    Actions build and deploy. The public site stays statically generated — the
    CMS never renders anything to visitors (spec §5, §7).

    Phase 5 completed the content model: config.yml now covers the six
    owner-editable content areas (src/_data/*.yml) plus per-page SEO
    title/description. tools/verify-cms-config.mjs cross-checks this file
    against the real data on every `npm run verify` — see config.yml's own
    header comment for the full editable/code-controlled split.

    AUTHENTICATION: Sveltia authenticates via GitHub. It needs a GitHub OAuth

    before login will work — see docs/DIWEBA_PHASE_0_SPEC.md §5.
